[versions]
adhan = "0.0.7"
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
datastore = "1.2.1"
haze = "2.0.1"
javaxInject = "1"
lifecycle = "2.11.0"
navigation = "2.10.2"
