name: iOS

# Builds and tests the iOS app on GitHub's Mac runners (free for public repositories) and takes
# Simulator screenshots, so the app can be developed without a Mac at hand.
on:
  push:
    branches: [ios]
    paths:
      - "ios/**"
      - "tools/i18n/**"
      - "core/location/src/main/assets/**"
      - "core/content/src/main/assets/**"
      - "core/prayer/src/test/resources/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest released Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: String catalog is up to date
        run: |
          python3 tools/i18n/build_ios_strings.py
          git diff --exit-code -- ios/Deen/Resources/Localizable.xcstrings

      - name: DeenKit tests (prayer times, Hijri, Qibla, cities)
        run: swift test --package-path ios/DeenKit

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              pro = [d for d in phones if d["name"].endswith(" Pro")]
              if phones:
                  print((pro or phones)[0]["udid"]); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Deen.xcodeproj -scheme Deen -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tee ios/build.log | (grep -E "error:|warning: .*/ios/|BUILD" || true)

      - name: Screenshots
        run: |
          chmod +x ios/scripts/screenshots.sh
          ios/scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" ios/DerivedData/Build/Products/Debug-iphonesimulator/Deen.app ios/screenshots

      - name: Walkthrough video (a UI test drives the app; the Simulator is recorded)
        continue-on-error: true
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl io "$UDID" recordVideo --codec h264 --force ios/walkthrough.mp4 &
          REC=$!
          sleep 3
          xcodebuild test -project ios/Deen.xcodeproj -scheme Deen -destination "id=$UDID" \
            -derivedDataPath ios/DerivedData -only-testing:DeenUITests CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30 || true
          kill -INT $REC
          wait $REC || true
          ls -la ios/walkthrough.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-walkthrough-video
          path: ios/walkthrough.mp4
          if-no-files-found: ignore

      - name: Package the Simulator build (to try it in a browser, e.g. on appetize.io)
        run: |
          cd ios/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Deen.app "$GITHUB_WORKSPACE/ios/Deen-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/Deen-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
