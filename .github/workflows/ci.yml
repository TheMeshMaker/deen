name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Formatting (ktlint via Spotless)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Lint (both flavors)
        run: ./gradlew :app:lintPlayDebug :app:lintFossDebug

      - name: Build debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleFossDebug

      # docs/BLUEPRINT.md §5: the FOSS build must not contain proprietary Google code.
      - name: FOSS build has no proprietary dependencies
        run: |
          ./gradlew -q :app:dependencies --configuration fossReleaseRuntimeClasspath > foss-deps.txt
          if grep -E "com\.google\.android\.gms|com\.google\.firebase|com\.android\.billingclient|com\.google\.android\.play" foss-deps.txt; then
            echo "::error::Proprietary dependency found in the foss flavor (see above)."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
